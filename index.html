<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPL Prediction League</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(to bottom, #0b1d3a, #09142b);
  color: white;
}

header {
  text-align: center;
  padding: 15px;
  background: #06122a;
  font-size: 22px;
  color: gold;
}

.container { padding: 15px; }

.card {
  background: rgba(255,255,255,0.05);
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 20px;
}

input, select, button {
  width: 100%;
  padding: 10px;
  margin: 6px 0;
  border-radius: 8px;
  border: none;
}

button {
  background: gold;
  font-weight: bold;
  cursor: pointer;
}

/* Match Cards */
.match-card {
  background: rgba(255,255,255,0.08);
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 10px;
}

/* Leaderboard */
.top-player {
  background: gold;
  color: black;
  font-weight: bold;
}

/* Trophy Animation */
.trophy {
  font-size: 40px;
  animation: pop 1s infinite alternate;
  text-align: center;
}

@keyframes pop {
  from { transform: scale(1); }
  to { transform: scale(1.2); }
}

/* Logos */
.logo {
  width: 30px;
  vertical-align: middle;
}

/* Mobile */
@media (max-width:600px){
  header { font-size:18px; }
}
</style>
</head>

<body>

<header>🏏 IPL Prediction League</header>

<div class="container">

<!-- Add Match -->
<div class="card">
<h3>Add Match</h3>

<input id="match" placeholder="MI vs CSK">

<select id="winner"></select>

<h4>Predictions</h4>
<div id="predictions"></div>

<button onclick="addMatch()">Add Match</button>
</div>

<!-- Trophy -->
<div id="trophySection"></div>

<!-- Match Cards -->
<div class="card">
<h3>Matches</h3>
<div id="matches"></div>
</div>

<!-- Leaderboard -->
<div class="card">
<h3>Leaderboard</h3>
<div id="leaderboard"></div>
</div>

<!-- Chart -->
<div class="card">
<h3>Stats</h3>
<canvas id="chart"></canvas>
</div>

</div>

<script>
const players = ["Bhabani","Laba","Sita","Toto","Bibhu","Subidha","Happy"];

const teams = {
  MI: "https://upload.wikimedia.org/wikipedia/en/c/cd/Mumbai_Indians_Logo.svg",
  CSK: "https://upload.wikimedia.org/wikipedia/en/2/2e/Chennai_Super_Kings_Logo.svg",
  RCB: "https://upload.wikimedia.org/wikipedia/en/4/4f/Royal_Challengers_Bangalore_Logo.svg",
  KKR: "https://upload.wikimedia.org/wikipedia/en/4/4c/Kolkata_Knight_Riders_Logo.svg",
  SRH: "https://upload.wikimedia.org/wikipedia/en/8/81/Sunrisers_Hyderabad.svg",
  DC: "https://upload.wikimedia.org/wikipedia/en/2/2f/Delhi_Capitals.svg",
  RR: "https://upload.wikimedia.org/wikipedia/en/6/60/Rajasthan_Royals_Logo.svg",
  PBKS: "https://upload.wikimedia.org/wikipedia/en/d/d4/Punjab_Kings_Logo.svg",
  GT: "https://upload.wikimedia.org/wikipedia/en/0/09/Gujarat_Titans_Logo.svg",
  LSG: "https://upload.wikimedia.org/wikipedia/en/0/03/Lucknow_Super_Giants_Logo.svg"
};

let matches = [];

/* Init */
function init(){
  let winner = document.getElementById("winner");
  Object.keys(teams).forEach(t=>{
    winner.innerHTML += `<option value="${t}">${t}</option>`;
  });

  let predDiv = document.getElementById("predictions");
  players.forEach(p=>{
    predDiv.innerHTML += `
      <label>${p}</label>
      <select id="${p}">
        ${Object.keys(teams).map(t=>`<option>${t}</option>`).join("")}
      </select>
    `;
  });
}

function addMatch(){
  let match = document.getElementById("match").value;
  let winner = document.getElementById("winner").value;

  let predictions = {};
  players.forEach(p=>{
    predictions[p] = document.getElementById(p).value;
  });

  matches.push({match,winner,predictions});
  render();
}

function render(){
  let matchDiv = "";
  let scores = {};
  players.forEach(p=>scores[p]=0);

  matches.forEach(m=>{
    let correct = [];

    players.forEach(p=>{
      if(m.predictions[p]===m.winner){
        correct.push(p);
        scores[p]++;
      }
    });

    matchDiv += `
    <div class="match-card">
      <b>${m.match}</b><br>
      Winner: <img class="logo" src="${teams[m.winner]}"> ${m.winner}<br>
      ✅ ${correct.join(", ")}
    </div>`;
  });

  document.getElementById("matches").innerHTML = matchDiv;

  /* Leaderboard */
  let sorted = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  let top = sorted[0][0];

  let lb = "";
  sorted.forEach(([p,s])=>{
    lb += `<div class="${p===top?'top-player':''}">
      ${p} - ${s}
    </div>`;
  });

  document.getElementById("leaderboard").innerHTML = lb;

  /* Trophy */
  document.getElementById("trophySection").innerHTML =
    `<div class="trophy">🏆 ${top} is Leading!</div>`;

  /* Chart */
  new Chart(document.getElementById("chart"), {
    type: 'bar',
    data: {
      labels: players,
      datasets: [{
        label: 'Wins',
        data: players.map(p=>scores[p]),
        backgroundColor: 'gold'
      }]
    }
  });
}

init();
</script>

</body>
</html>
