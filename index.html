<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPL Prediction League</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #f5f7fb;
}

header {
  text-align: center;
  padding: 12px;
  background: white;
  border-bottom: 1px solid #ddd;
}

header img { width: 35px; }

.container {
  max-width: 900px;
  margin: auto;
  padding: 15px;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
}

select { width: 70px; padding: 5px; }

button {
  padding: 8px;
  background: #007bff;
  color: white;
  border: none;
  border-radius: 6px;
}

.top { color: green; font-weight: bold; }
.trophy { text-align: center; font-size: 20px; }
</style>
</head>

<body>

<header>
<img src="https://upload.wikimedia.org/wikipedia/en/1/1e/Indian_Premier_League_Logo.svg">
IPL Prediction League
</header>

<div id="loginBox" style="text-align:center;margin-top:80px;">
<input type="password" id="pass" placeholder="Admin password">
<br><br>
<button onclick="login()">Login</button>
</div>

<div id="app" class="container" style="display:none;">

<div id="adminPanel" class="card" style="display:none;">
<input id="match" placeholder="MI vs CSK">
<select id="winner"></select>
<div id="predictions"></div>
<button onclick="addMatch()">Add Match</button>
</div>

<div id="trophy"></div>

<div class="card"><div id="matches"></div></div>
<div class="card"><div id="leaderboard"></div></div>
<div class="card"><canvas id="chart"></canvas></div>

</div>

<script>
const ADMIN_PASSWORD = "ipl123";

const players = ["Bhabani","Laba","Sita","Toto","Bibhu","Subidha","Happy"];
const teams = ["MI","CSK","RCB","KKR","SRH","DC","RR","PBKS","GT","LSG"];

/* Firebase Config (PASTE YOURS HERE) */
const firebaseConfig = {
    apiKey: "AIzaSyA5k9eO7V3xvaRtUw0p2z1RUwey8-LpGQA",
    authDomain: "ipl-prediction-2026.firebaseapp.com",
    projectId: "ipl-prediction-2026",
    storageBucket: "ipl-prediction-2026.firebasestorage.app",
    messagingSenderId: "778718337887",
    appId: "1:778718337887:web:48f9bfb4601351731774ea",
    measurementId: "G-23XGL3TXQ9"
  };

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* Login */
function login(){
  document.getElementById("loginBox").style.display="none";
  document.getElementById("app").style.display="block";

  if(document.getElementById("pass").value === ADMIN_PASSWORD){
    document.getElementById("adminPanel").style.display="block";
  }

  init();
  loadData();
}

/* Init */
function init(){
  let winner = document.getElementById("winner");

  teams.forEach(t=>{
    winner.innerHTML += `<option>${t}</option>`;
  });

  let pred = document.getElementById("predictions");

  players.forEach(p=>{
    pred.innerHTML += `${p}
    <select id="${p}">
      ${teams.map(t=>`<option>${t}</option>`).join("")}
    </select><br>`;
  });
}

/* Add Match */
function addMatch(){
  let match = document.getElementById("match").value;
  let winner = document.getElementById("winner").value;

  let predictions = {};
  players.forEach(p=>{
    predictions[p] = document.getElementById(p).value;
  });

  db.collection("matches").add({match,winner,predictions});
}

/* Live Data */
function loadData(){
  db.collection("matches").onSnapshot(snapshot=>{
    let matches=[];
    snapshot.forEach(doc=>matches.push(doc.data()));
    render(matches);
  });
}

/* Render */
function render(matches){
  let scores={};
  players.forEach(p=>scores[p]=0);

  let html="";

  matches.forEach(m=>{
    let correct=[];

    players.forEach(p=>{
      if(m.predictions[p]===m.winner){
        correct.push(p);
        scores[p]++;
      }
    });

    html += `${m.match} → ${m.winner}<br>✔ ${correct.join(", ")}<hr>`;
  });

  document.getElementById("matches").innerHTML = html;

  let sorted = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  let top = sorted[0][0];

  document.getElementById("leaderboard").innerHTML =
    sorted.map(([p,s])=>`<div class="${p===top?'top':''}">${p} - ${s}</div>`).join("");

  document.getElementById("trophy").innerHTML =
    `<div class="trophy">🏆 ${top} leading</div>`;

  new Chart(document.getElementById("chart"), {
    type:'bar',
    data:{
      labels:players,
      datasets:[{data:players.map(p=>scores[p])}]
    }
  });
}
</script>

</body>
</html>
